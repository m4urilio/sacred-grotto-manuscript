<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Manuscript of the Sacred Grotto — Free Spiritual Assessment</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%235C3318'/><text x='16' y='23' font-family='Arial,sans-serif' font-size='18' font-weight='bold' fill='%23B8820A' text-anchor='middle'>✦</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brown:         #7B4A2A;
      --brown-dark:    #5C3318;
      --brown-deeper:  #3D2010;
      --brown-light:   #F5EDD8;
      --brown-mid:     #D4BC9A;
      --amber:         #B8820A;
      --amber-dark:    #8B6208;
      --amber-light:   #FDF8EE;
      --amber-mid:     #E8D098;
      --grey-100:      #EDE0C4;
      --grey-200:      #D9C9AA;
      --grey-400:      #A08060;
      --grey-600:      #6B5040;
      --grey-800:      #2C1810;
      --white:         #FEFCF7;
      --radius:        14px;
      --shadow:        0 4px 28px rgba(107,58,30,.13);
    }

    body {
      font-family: 'Lora', Georgia, serif;
      background: var(--grey-100);
      color: var(--grey-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── HEADER ── */
    .header {
      width: 100%;
      background: linear-gradient(135deg, #2C1408 0%, #5C3318 50%, #2C1408 100%);
      display: flex;
      justify-content: center;
      padding: 18px 24px;
      border-bottom: 2px solid var(--amber);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--amber) 0%, #D4A030 100%);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
    }
    .logo-text {
      font-size: 1.1rem; font-weight: 700;
      color: var(--white); letter-spacing: -.3px; line-height: 1.2;
    }
    .logo-text span { color: var(--gold); }

    /* ── WRAPPER ── */
    .wrapper {
      width: 100%; max-width: 660px;
      padding: 32px 16px 60px;
      display: flex; flex-direction: column; align-items: center;
    }

    /* ── PROGRESS ── */
    .progress-area { width: 100%; margin-bottom: 20px; }
    .progress-meta {
      display: flex; justify-content: space-between;
      font-size: .78rem; font-weight: 600; color: var(--grey-400);
      margin-bottom: 8px;
    }
    .progress-bar-bg {
      width: 100%; height: 7px;
      background: var(--grey-200); border-radius: 99px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brown) 0%, var(--amber) 100%);
      border-radius: 99px;
      transition: width .5s cubic-bezier(.4,0,.2,1);
    }

    /* ── BACK BUTTON ── */
    .back-btn {
      width: 100%; display: flex; align-items: center; gap: 5px;
      background: none; border: none; cursor: pointer;
      color: var(--grey-400); font-size: .78rem; font-weight: 600;
      font-family: 'Lora', Georgia, serif; padding: 0 0 12px 0;
      transition: color .2s;
    }
    .back-btn:hover { color: var(--grey-600); }
    .back-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
    .back-btn.hidden { visibility: hidden; pointer-events: none; }

    /* ── CARD ── */
    .card {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 32px;
      animation: fadeUp .35s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .question-label {
      font-size: .7rem; font-weight: 700;
      color: var(--brown); letter-spacing: .1em;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .question-text {
      font-size: 1.18rem; font-weight: 700;
      color: var(--grey-800); line-height: 1.45;
      margin-bottom: 26px;
    }

    /* ── OPTIONS ── */
    .options { display: flex; flex-direction: column; gap: 10px; }

    .option {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px;
      border: 2px solid var(--grey-200);
      border-radius: 10px;
      cursor: pointer;
      background: var(--white);
      transition: border-color .18s, background .18s, transform .14s, box-shadow .18s;
      font-size: .93rem; font-weight: 500; color: var(--grey-800);
      text-align: left; width: 100%; font-family: 'Lora', Georgia, serif;
    }
    .option:hover {
      border-color: var(--brown);
      background: var(--brown-light);
      transform: translateX(4px);
      box-shadow: 0 2px 12px rgba(107,58,30,.12);
    }
    .option.selected {
      border-color: var(--brown);
      background: var(--brown-light);
    }
    .option-bullet {
      width: 20px; height: 20px; min-width: 20px;
      border-radius: 50%;
      border: 2px solid var(--grey-400);
      display: flex; align-items: center; justify-content: center;
      transition: border-color .18s, background .18s;
      flex-shrink: 0;
    }
    .option.selected .option-bullet {
      border-color: var(--brown);
      background: var(--brown);
    }
    .option.selected .option-bullet::after {
      content: '';
      width: 7px; height: 7px;
      background: white; border-radius: 50%;
    }

    /* ── YES/NO ── */
    .yn-options { display: flex; gap: 14px; }
    .yn-btn {
      flex: 1; padding: 22px 10px;
      border-radius: 12px; border: 2px solid var(--grey-200);
      background: var(--white); cursor: pointer;
      font-size: .98rem; font-weight: 700; font-family: 'Lora', Georgia, serif;
      transition: all .2s;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      color: var(--grey-800);
    }
    .yn-btn .yn-icon { font-size: 1.75rem; }
    .yn-btn.yes:hover, .yn-btn.yes.selected {
      border-color: var(--brown); background: var(--brown-light);
      color: var(--brown-dark);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(107,58,30,.2);
    }
    .yn-btn.no:hover, .yn-btn.no.selected {
      border-color: var(--grey-400); background: var(--grey-100);
      color: var(--grey-600);
      transform: translateY(-2px);
    }

    /* ── INTERMEDIATE MESSAGE ── */
    .mid-card {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
      animation: fadeUp .45s ease both;
    }
    .mid-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--brown-light) 0%, var(--amber-light) 100%);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 2.2rem;
    }
    .mid-badge {
      display: inline-block;
      background: var(--brown-mid); color: var(--brown-deeper);
      font-size: .74rem; font-weight: 700;
      padding: 4px 14px; border-radius: 99px;
      letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 16px;
    }
    .mid-title {
      font-size: 1.45rem; font-weight: 700;
      color: var(--grey-800); line-height: 1.35;
      margin-bottom: 14px;
    }
    .mid-title span { color: var(--brown); }
    .mid-body {
      font-size: .94rem; color: var(--grey-600);
      line-height: 1.68; margin-bottom: 24px;
    }
    .mid-highlights {
      display: flex; flex-direction: column; gap: 10px;
      background: var(--grey-100); border-radius: 10px;
      padding: 18px 20px; margin-bottom: 28px; text-align: left;
    }
    .mid-highlight-item {
      display: flex; align-items: center; gap: 10px;
      font-size: .87rem; font-weight: 500; color: var(--grey-800);
    }
    .mid-highlight-item .dot {
      width: 8px; height: 8px; min-width: 8px;
      background: var(--gold); border-radius: 50%;
    }
    .btn-continue {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, var(--brown) 0%, var(--brown-dark) 100%);
      color: white;
      font-size: .98rem; font-weight: 700; font-family: 'Lora', Georgia, serif;
      border: none; border-radius: 10px; cursor: pointer;
      transition: opacity .2s, transform .15s, box-shadow .2s;
    }
    .btn-continue:hover {
      opacity: .9;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(107,58,30,.3);
    }

    /* ── FINAL RESULT ── */
    .result-card {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
      animation: fadeUp .45s ease both;
    }
    .result-icon { font-size: 2.8rem; margin-bottom: 16px; }
    .result-badge {
      display: inline-block;
      background: var(--amber-mid); color: #4A2508;
      font-size: .74rem; font-weight: 700;
      padding: 4px 14px; border-radius: 99px;
      letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 18px;
    }
    .result-title {
      font-size: 1.45rem; font-weight: 700;
      color: var(--grey-800); line-height: 1.35; margin-bottom: 14px;
    }
    .result-title span { color: var(--brown); }
    .result-body {
      font-size: .93rem; color: var(--grey-600);
      line-height: 1.72; margin-bottom: 26px;
    }
    .result-features {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 28px;
    }
    .result-feature {
      background: linear-gradient(135deg, var(--brown-light) 0%, var(--amber-light) 100%);
      border-radius: 10px; padding: 14px 12px;
      font-size: .82rem; font-weight: 600; color: var(--brown-deeper);
      text-align: center;
      transition: transform .18s, box-shadow .18s;
    }
    .result-feature:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(107,58,30,.14);
    }
    .result-feature .f-icon { font-size: 1.3rem; display: block; margin-bottom: 4px; }
    .btn-cta {
      display: block; width: 100%; padding: 18px;
      background: linear-gradient(135deg, var(--amber) 0%, var(--amber-dark) 100%);
      color: #1a0a00;
      font-size: 1rem; font-weight: 700; font-family: 'Lora', Georgia, serif;
      border: none; border-radius: 10px; cursor: pointer;
      text-decoration: none;
      transition: opacity .2s, transform .15s, box-shadow .2s;
    }
    .btn-cta:hover {
      opacity: .92;
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(184,130,10,.35);
    }
    .cta-sub {
      font-size: .78rem; color: var(--grey-400);
      margin-top: 12px;
    }

    /* ── TRUST BAR ── */
    .trust-bar {
      width: 100%; max-width: 660px;
      padding: 0 16px;
      display: flex; justify-content: center; gap: 24px;
      flex-wrap: wrap; margin-top: 24px;
    }
    .trust-item {
      display: flex; align-items: center; gap: 6px;
      font-size: .76rem; color: var(--grey-400); font-weight: 500;
    }
    .trust-item svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .card, .mid-card, .result-card { padding: 26px 18px; }
      .question-text { font-size: 1.06rem; }
      .result-features { grid-template-columns: 1fr; }
      .yn-options { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <a class="logo" href="#">
      <div class="logo-icon">&#10024;</div>
      <div class="logo-text">The Manuscript<br><span>of the Sacred Grotto</span></div>
    </a>
  </header>

  <!-- MAIN -->
  <main class="wrapper">
    <div class="progress-area" id="progressArea">
      <button class="back-btn hidden" id="backBtn" onclick="goBack()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Go back
      </button>
      <div class="progress-meta">
        <span id="progressLabel">Question 1 of 13</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
    <div id="quizContainer"></div>
  </main>

  <!-- TRUST BAR -->
  <div class="trust-bar">
    <div class="trust-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      100% safe &amp; free
    </div>
    <div class="trust-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      Your answers are private
    </div>
    <div class="trust-item">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Takes less than 2 minutes
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════
       BRANCHING QUIZ — The Manuscript of the Sacred Grotto
       Q1 (shared) → Q2 (branch by life area)
       → 5 themed Qs → mid message
       → 3 shared Qs → 3 dynamic yes/no → result
    ═══════════════════════════════════════════ */

    const BRANCH_KEYS  = ['money', 'love', 'spirituality', 'health'];
    const TRACK_LABELS = {
      money:        'finances &amp; abundance',
      love:         'love &amp; relationships',
      spirituality: 'spirituality &amp; purpose',
      health:       'health &amp; vitality',
    };

    // Q1 — shared opener
    const Q_SHARED_START = [{
      id: 1, type: 'choice',
      text: 'How long have you been seeking a spiritual or life breakthrough?',
      options: [
        'I am just beginning — something recently awakened inside me',
        'A few months — I feel a calling I can no longer ignore',
        'For years — I have tried many paths but lasting change eludes me',
        'I feel stuck in a cycle I cannot seem to break on my own',
      ],
    }];

    // Q2 — branch selector
    const Q_BRANCH = {
      id: 2, type: 'choice', isBranch: true,
      text: 'Which area of your life is calling for a divine transformation right now?',
      options: [
        '&#128176; Finances &amp; Abundance — I want to open the flow of prosperity',
        '&#10084;&#65039; Love &amp; Relationships — I want to attract or heal my love life',
        '&#10024; Spirituality &amp; Purpose — I want a deeper connection with the divine',
        '&#127807; Health &amp; Vitality — I want to restore my energy and wellbeing',
      ],
    };

    // Q3–Q7 — five themed questions per track
    const TRACKS = {
      money: [
        { id:3, type:'choice', text:'How would you honestly describe your current financial reality?', options:['Constant struggle — money never seems to stay with me','Unstable — good periods always followed by setbacks','Comfortable, but far below what I know I deserve','Blocked — I work hard but the flow just will not open'] },
        { id:4, type:'choice', text:'When you think about money, what emotion rises most strongly?', options:['Fear and anxiety — I worry about lack constantly','Guilt — deep down I feel undeserving of real prosperity','Frustration — I do everything right but results never match','Confusion — I do not understand why abundance eludes me'] },
        { id:5, type:'choice', text:'Have you ever set sacred intentions or worked with spiritual tools around financial abundance?', options:['Never — I did not know spirituality could open financial doors','Yes, but I felt no real shift in my circumstances','Yes, and I noticed some change — but it did not last','Yes — I deeply believe spirit and financial flow are connected'] },
        { id:6, type:'choice', text:'What do you sense is the spiritual root of your financial block?', options:['Generational patterns — inherited beliefs about money and lack','Deep unworthiness — a hidden feeling that I do not deserve it','Fear of wealth — unconscious resistance to having more','I have not identified the block — that is exactly why I am here'] },
        { id:7, type:'choice', text:'If a sacred daily practice could open the flow of abundance, how ready are you?', options:['Completely ready — I will start tonight','Very ready — I just need the right sacred tools','Mostly ready — I have doubts but I truly want this','I need more clarity before I can fully commit'] },
      ],
      love: [
        { id:3, type:'choice', text:'How would you honestly describe your current love life?', options:['Deeply lonely — I have not yet found my person','In a relationship but feeling disconnected or unloved','Healing from a painful breakup or betrayal','Open and ready — I want to attract a divine love now'] },
        { id:4, type:'choice', text:'What do you sense is the deepest spiritual block in your love life?', options:['I keep attracting the wrong people — the same patterns repeat','I feel unworthy of real, lasting, unconditional love','Past wounds are still open, preventing me from trusting again','I have lost faith that the love I deserve truly exists for me'] },
        { id:5, type:'choice', text:'Have you ever used spiritual practice or sacred wisdom to attract or heal love?', options:['Never — I did not know spirituality could open this door','Yes, but I saw no change in my love life','Yes, and something shifted — but the pattern returned','Yes — I believe love and spiritual energy are completely intertwined'] },
        { id:6, type:'choice', text:'When you imagine your ideal relationship, what feels most out of reach?', options:['Being truly chosen and loved without conditions','Finding someone spiritually aligned with my soul','Breaking the cycle of toxic or one-sided connections','Healing my own heart enough to fully receive love'] },
        { id:7, type:'choice', text:'How ready are you to use sacred ancient wisdom to open your heart and attract divine love?', options:['Completely ready — love is my highest priority right now','Very ready — I have been looking for the right sacred path','Mostly ready — hopeful, but a little afraid to open up again','I want to understand more before I open my heart fully'] },
      ],
      spirituality: [
        { id:3, type:'choice', text:'How would you describe the state of your spiritual connection right now?', options:['Completely disconnected — I feel spiritually empty inside','Searching — I sense there is more, but I cannot find it','Growing — I have moments of connection but it is inconsistent','Awake but stuck — I need a deeper practice to go further'] },
        { id:4, type:'choice', text:'What is the greatest obstacle to your spiritual growth?', options:['Doubt — I struggle to trust what I cannot see or prove','Distraction — daily life constantly pulls me from my practice','Lack of tools — I do not know the right sacred methods','Old wounds and unresolved emotions blocking my path forward'] },
        { id:5, type:'choice', text:'Have you ever worked with sacred decrees, ancient manuscripts, or esoteric wisdom?', options:['Never — I am completely new to this tradition','I have heard of it but never actually practiced it','Yes, briefly — and I felt something undeniably powerful','Yes — this tradition resonates at the deepest level of my soul'] },
        { id:6, type:'choice', text:'How often do you experience signs, synchronicities, or divine confirmations?', options:['Rarely — I feel my intentions and invocations go unanswered','Occasionally — I notice them but still doubt myself','Often — I know the Universe is speaking to me','Constantly — I live in full awareness of divine guidance'] },
        { id:7, type:'choice', text:'If you received a proven sacred practice, how committed would you be to following it daily?', options:['Fully committed — I am ready for a total spiritual shift','Very committed — I just need the right guidance','Somewhat committed — I want to begin gently','I need more understanding before I can truly commit'] },
      ],
      health: [
        { id:3, type:'choice', text:'How would you describe your current physical and energetic health?', options:['Struggling — chronic issues are affecting my quality of life','Drained — I feel tired, heavy, and depleted most days','Recovering — I have been through something and I am rebuilding','Okay physically, but something feels spiritually off in my body'] },
        { id:4, type:'choice', text:'What do you believe is the deepest spiritual root of your health challenges?', options:['Unresolved emotional trauma stored deep in my body','Spiritual imbalance — my energy field feels blocked or heavy','Generational or karmic patterns expressing through my health','I have not identified the root yet — that is why I am here'] },
        { id:5, type:'choice', text:'Have you ever used sacred intention, ancient wisdom, or spiritual practice to support your healing?', options:['Never — I relied only on conventional medicine and methods','Yes, but I did not feel a real link between spirit and healing','Yes, and I experienced genuine relief and real improvement','Yes — I firmly believe spiritual and physical health are one'] },
        { id:6, type:'choice', text:'How connected do you feel between your spiritual life and your physical wellbeing?', options:['Not at all — I see them as completely separate','Slightly — I notice my emotions affect my body','Strongly — I know my spiritual state influences my health','Completely — I experience this mind-body-spirit unity daily'] },
        { id:7, type:'choice', text:'If a sacred daily practice could support your healing journey, how ready are you?', options:['Completely ready — I will try anything that can truly help','Very ready — I have been searching for exactly this','Mostly ready — I have some doubts but I am open','I want to understand more before making a commitment'] },
      ],
    };

    // Q8–Q10 — shared closing
    const Q_SHARED_END = [
      { id:8, type:'choice', text:'Have you ever experienced a spiritual miracle or a moment of undeniable divine confirmation?', options:['Never — and that is part of why I am still searching','Once or twice — but I was not fully sure it was real','Yes, several times — it confirmed and deepened my faith','Frequently — miracles and divine confirmations are part of my life'] },
      { id:9, type:'choice', text:'How familiar are you with ancient sacred manuscripts and hidden spiritual wisdom?', options:['Completely new — I have never explored this before','I have heard about it but know very little','I know the basics and feel deeply drawn to this tradition','I have studied it and feel a soul-level connection to it'] },
      { id:10, type:'choice', text:'How committed are you to beginning a daily sacred practice starting today?', options:['Completely — I am ready to transform my life right now','Very committed — I just need the right tools and guidance','Somewhat — I will start and see what unfolds','I prefer to move at my own rhythm and pace'] },
    ];

    // Q11–Q13 — dynamic yes/no based on chosen track
    function getYesNoQuestions(track) {
      var area = TRACK_LABELS[track];
      return [
        { id:11, type:'yesno', text:'Would you like to receive The Manuscript of the Sacred Grotto — a sacred collection designed to open the divine path to <em>' + area + '</em> and every area of your life?' },
        { id:12, type:'yesno', text:'If there was a proven sacred method — used by masters of the Law of Attraction — that could dissolve the exact blocks holding you back in <em>' + area + '</em>, would you want to access it?' },
        { id:13, type:'yesno', text:'Are you ready to receive The Manuscript of the Sacred Grotto and begin your transformation in <em>' + area + '</em> today?' },
      ];
    }

    // Mid message content per track
    var MID_CONTENT = {
      money:        { icon:'&#128176;', title:'Your path to abundance <span>is about to open.</span>', body:'Based on your answers, there are real spiritual blocks around your finances — and they are not permanent. The Manuscript of the Sacred Grotto was designed to dissolve exactly these energetic barriers and restore the divine flow of prosperity.', dots:['Financial blocks rooted in deep spiritual and energetic patterns','Profile compatible with rapid abundance transformation','The Sacred Grotto manuscript can dissolve your blocks and open the flow of prosperity'] },
      love:         { icon:'&#10084;&#65039;', title:'Your heart is ready to <span>receive divine love.</span>', body:'Based on your answers, the patterns blocking your love life run deeper than circumstances — they are energetic. The right sacred tools can dissolve these patterns and open you to the love your soul truly deserves.', dots:['Love blocks rooted in deep energetic and spiritual patterns','Profile compatible with rapid transformation in relationships','The Sacred Grotto can heal your heart and attract divine love into your life'] },
      spirituality: { icon:'&#10024;', title:'Your soul is ready for a <span>deeper awakening.</span>', body:'Based on your answers, you are closer to a spiritual breakthrough than you realize. The obstacles you feel are not signs of failure — they are signs you are ready to rise. The Manuscript of the Sacred Grotto will guide you through this threshold.', dots:['Spiritual blocks that are real — and entirely dissolve-able','Profile compatible with deep and accelerated spiritual transformation','The Sacred Grotto manuscript can elevate your connection to the divine'] },
      health:       { icon:'&#127807;', title:'Your healing <span>begins in the spirit.</span>', body:'Based on your answers, there is a spiritual dimension to your health journey that conventional approaches miss. The Manuscript of the Sacred Grotto addresses the energetic and spiritual roots of physical and emotional imbalance at the source.', dots:['Health challenges with deep spiritual and energetic roots','Profile compatible with genuine energetic restoration','The Sacred Grotto manuscript can dissolve the spiritual blocks affecting your wellbeing'] },
    };

    // Result content per track
    var RESULT_CONTENT = {
      money:        { icon:'&#128176;', badge:'&#10024; You Are Called to Prosperity', title:'Your path to financial abundance <span>is being opened.</span>', body:'Congratulations on completing your assessment. Your profile reveals someone ready for a profound financial shift. The The Manuscript of the Sacred Grotto include specific decrees to dissolve poverty consciousness, attract prosperity, and align your energy with divine abundance — used by thousands who have broken free from financial limitation.' },
      love:         { icon:'&#10084;&#65039;', badge:'&#10024; You Are Called to Divine Love', title:'The love you deserve <span>is closer than you think.</span>', body:'Congratulations on completing your assessment. Your profile reveals a heart ready to receive. The The Manuscript of the Sacred Grotto include sacred decrees for healing, attracting, and deepening love — dissolving the energetic patterns that have kept you from the relationship your soul truly deserves.' },
      spirituality: { icon:'&#10024;', badge:'&#10024; You Are Called to Awakening', title:'Your spiritual breakthrough <span>is already unfolding.</span>', body:'Congratulations on completing your assessment. Your profile reveals a soul at the threshold of a profound awakening. The The Manuscript of the Sacred Grotto are a transmission of divine light — each decree a key to dissolve the veils between you and your highest spiritual potential.' },
      health:       { icon:'&#127807;', badge:'&#10024; You Are Called to Wholeness', title:'Your healing <span>is already beginning.</span>', body:'Congratulations on completing your assessment. Your profile reveals someone ready for deep restoration. The The Manuscript of the Sacred Grotto include sacred decrees to cleanse the energy field, dissolve karmic health patterns, and align your body, mind, and spirit with the divine blueprint of perfect health.' },
    };

    // ── STATE ──
    var TOTAL = 13;
    var INTERMEDIATE_AFTER = 7;

    var sequence      = Q_SHARED_START.concat([Q_BRANCH]);
    var currentStep   = 0;
    var stepHistory   = [];
    var answers       = {};
    var advancing     = false;
    var selectedTrack = null;

    function buildSequence(track) {
      selectedTrack = track;
      sequence = Q_SHARED_START.concat([Q_BRANCH], TRACKS[track], Q_SHARED_END, getYesNoQuestions(track));
    }

    var container     = document.getElementById('quizContainer');
    var progressArea  = document.getElementById('progressArea');
    var progressFill  = document.getElementById('progressFill');
    var progressLabel = document.getElementById('progressLabel');
    var progressPct   = document.getElementById('progressPct');
    var backBtn       = document.getElementById('backBtn');

    function updateProgress() {
      var pct = Math.round((currentStep / TOTAL) * 100);
      progressFill.style.width = pct + '%';
      progressLabel.textContent = 'Question ' + (currentStep + 1) + ' of ' + TOTAL;
      progressPct.textContent   = pct + '%';
    }

    function showBack(visible) {
      backBtn.classList.toggle('hidden', !visible);
    }

    function renderQuestion(index) {
      if (index < 0 || index >= sequence.length) return;
      var q = sequence[index];
      updateProgress();
      showBack(stepHistory.length > 0);
      advancing = false;

      if (q.type === 'choice') {
        container.innerHTML =
          '<div class="card">' +
            '<div class="question-label">Question ' + (index + 1) + ' of ' + TOTAL + '</div>' +
            '<div class="question-text">' + q.text + '</div>' +
            '<div class="options" id="options"></div>' +
          '</div>';

        var opts = document.getElementById('options');
        q.options.forEach(function(opt, i) {
          var btn = document.createElement('button');
          btn.className = 'option';
          btn.innerHTML = '<div class="option-bullet"></div><span>' + opt + '</span>';
          btn.onclick = (function(b, idx, qId, isBranch) {
            return function() { selectAndAdvance(b, idx, qId, isBranch); };
          })(btn, i, q.id, !!q.isBranch);
          opts.appendChild(btn);
        });

        if (answers[q.id] !== undefined) {
          var allOpts = document.querySelectorAll('.option');
          if (allOpts[answers[q.id]]) allOpts[answers[q.id]].classList.add('selected');
        }
      } else {
        container.innerHTML =
          '<div class="card">' +
            '<div class="question-label">Question ' + (index + 1) + ' of ' + TOTAL + '</div>' +
            '<div class="question-text">' + q.text + '</div>' +
            '<div class="yn-options">' +
              '<button class="yn-btn yes" onclick="handleYesNo(\'yes\',' + q.id + ')">' +
                '<span class="yn-icon">&#10024;</span>Yes, I want that!' +
              '</button>' +
              '<button class="yn-btn no" onclick="handleYesNo(\'no\',' + q.id + ')">' +
                '<span class="yn-icon">&#10006;</span>No' +
              '</button>' +
            '</div>' +
          '</div>';
      }
    }

    function selectAndAdvance(btn, idx, qId, isBranch) {
      if (advancing) return;
      advancing = true;

      document.querySelectorAll('.option').forEach(function(o) { o.classList.remove('selected'); });
      btn.classList.add('selected');
      answers[qId] = idx;

      if (isBranch) buildSequence(BRANCH_KEYS[idx]);

      setTimeout(function() {
        stepHistory.push({ step: currentStep, wasMid: false });
        currentStep++;
        if (currentStep === INTERMEDIATE_AFTER) {
          showMidMessage();
        } else {
          renderQuestion(currentStep);
        }
      }, 320);
    }

    function handleYesNo(val, qId) {
      if (advancing) return;
      advancing = true;
      answers[qId] = val;

      var btn = document.querySelector('.yn-btn.' + (val === 'yes' ? 'yes' : 'no'));
      if (btn) btn.classList.add('selected');

      setTimeout(function() {
        stepHistory.push({ step: currentStep, wasMid: false });
        currentStep++;
        if (currentStep >= sequence.length) {
          showResult();
        } else {
          renderQuestion(currentStep);
        }
      }, 300);
    }

    function getMidHTML() {
      var m = MID_CONTENT[selectedTrack] || MID_CONTENT.money;
      var dots = m.dots.map(function(d) {
        return '<div class="mid-highlight-item"><div class="dot"></div>' + d + '</div>';
      }).join('');
      return '<div class="mid-card">' +
        '<div class="mid-icon">' + m.icon + '</div>' +
        '<div class="mid-badge">Your Spiritual Profile Is Ready</div>' +
        '<div class="mid-title">' + m.title + '</div>' +
        '<p class="mid-body">' + m.body + '</p>' +
        '<div class="mid-highlights">' + dots + '</div>' +
        '<button class="btn-continue" onclick="continueMid()">Reveal my full result &rarr;</button>' +
      '</div>';
    }

    function showMidMessage() {
      progressArea.style.display = 'none';
      showBack(false);
      advancing = false;
      container.innerHTML = getMidHTML();
    }

    function continueMid() {
      stepHistory.push({ step: null, wasMid: true });
      progressArea.style.display = 'block';
      renderQuestion(currentStep);
    }

    function goBack() {
      if (stepHistory.length === 0) return;
      var prev = stepHistory.pop();

      if (prev.wasMid) {
        currentStep = INTERMEDIATE_AFTER;
        progressArea.style.display = 'none';
        showBack(false);
        advancing = false;
        container.innerHTML = getMidHTML();
        return;
      }

      currentStep = prev.step;
      progressArea.style.display = 'block';
      renderQuestion(currentStep);
    }

    function showResult() {
      var r = RESULT_CONTENT[selectedTrack] || RESULT_CONTENT.money;
      progressArea.style.display = 'none';
      showBack(false);
      container.innerHTML =
        '<div class="result-card">' +
          '<div class="result-icon">' + r.icon + '</div>' +
          '<div class="result-badge">' + r.badge + '</div>' +
          '<div class="result-title">' + r.title + '</div>' +
          '<p class="result-body">' + r.body + '</p>' +
          '<div class="result-features">' +
            '<div class="result-feature"><span class="f-icon">&#129717;</span>The Sacred Manuscript</div>' +
            '<div class="result-feature"><span class="f-icon">&#10024;</span>Violet Flame Power</div>' +
            '<div class="result-feature"><span class="f-icon">&#128176;</span>Finances &amp; Love</div>' +
            '<div class="result-feature"><span class="f-icon">&#127775;</span>All Areas of Life</div>' +
          '</div>' +
          '<a href="https://pay.hotmart.com/D100173663W?checkoutMode=10&bid=1779404623178" class="btn-cta">' +
            'Access The Manuscript now &rarr;' +
          '</a>' +
          '<p class="cta-sub">Secure access &bull; Instant delivery &bull; Transform your life today</p>' +
        '</div>';
    }

    // ── INIT ──
    renderQuestion(0);

    // ── BACK BUTTON REDIRECT ──
    history.pushState(null, '', location.href);
    window.addEventListener('popstate', function() {
      history.pushState(null, '', location.href);
      window.location.replace('https://pay.hotmart.com/D100173663W?checkoutMode=10&bid=1779404623178');
    });
  </script>
